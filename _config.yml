# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 維袒
subtitle: ⁣⁣⁣Never Settle | ivitan.com
description: Vitan's Personal Website.
keywords: Coder,Linux,Web,Blog...
author: VITAN
# 修正点 1：初步排除多语言干扰，先设为单语言。成功后再尝试列表形式。
language: zh-CN 
timezone: Asia/Shanghai

# URL
## 修正点 2：确保 URL 末尾没有斜杠，root 为 /
url: https://ivitan.com
root: /
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  # 修正点 3：Stellar 主题建议关闭 trailing_html 以保证链接整洁
  trailing_html: false 

# Directory  
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: ':lang'
skip_render: [] # 修正点 4：避免使用 null，空数组更安全

# Writing
new_post_name: ':title.md'
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''

filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

index_generator:
  path: ''
  per_page: 10
  order_by: '-date'

# Category & Tag
default_category: uncategorized
category_map: 
tag_map: 
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
updated_option: mtime
per_page: 10
pagination_dir: page
include:
exclude:
ignore:

# Plugins - RSS & Sitemap
feed:
  type: atom
  path: xml/atom.xml # 去掉前面的 / 避免路径解析问题

sitemap:
  path: xml/sitemap.xml

baidusitemap:
  path: xml/baidusitemap.xml

# 插件配置
jsdelivr_auto_fallback:
  enable: true
  add_defer: true

# 注入配置
inject:
  head:
    - <link rel="shortcut icon" href="/assets/logo/favicon.svg">
    - <script async src="https://www.googletagmanager.com/gtag/js?id=G-XEHQ8YBEN0"></script>
    - <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-XEHQ8YBEN0');</script>

# Extensions
theme: stellar
