name: Hexo Deploy

on:
  push:
    branches: 
      - source # 源码分支

jobs:
  build: 
    runs-on: ubuntu-latest
    name: auto deploy
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: source
        # 既然是 npm 安装主题，不需要处理子模块
        submodules: false 

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'

    - name: Install Dependencies
      # 这一步会根据你的 package.json 自动安装 hexo、stellar 主题和渲染器
      run: npm install

    - name: Generate Public Files
      run: |
        npx hexo clean
        npx hexo generate

    - name: Deploy to Master
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: master
        publish_dir: ./public
        cname: ivitan.com
        commit_message: "Auto deploy: ${{ github.event.head_commit.message }}"
        user_name: 'Vitan'
        user_email: 'vitan.me@gmail.com'
