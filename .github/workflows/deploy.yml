name: Hexo Deploy

on:
  push:
    branches: 
      - source # 只有 source 分支有变动时才触发

jobs:
  build: 
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: source
        submodules: 'recursive' # 关键：递归拉取主题子模块
        fetch-depth: 0          # 拉取完整历史，避免某些插件报错

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'      # 使用当前的长期支持版
        cache: 'npm'            # 开启缓存，加快后续部署速度

    - name: Install & Generate
      run: |
        npm install
        npx hexo clean
        npx hexo generate

    - name: Deploy to Master
      uses: peaceiris/actions-gh-pages@v3
      with:
        # 建议使用系统自带的 GITHUB_TOKEN，更安全且无需手动维护
        github_token: ${{ secrets.GITHUB_TOKEN }}
        # 你的仓库是个人主页，必须部署到 master 分支
        publish_branch: master
        publish_dir: ./public
        commit_message: "Auto deploy: ${{ github.event.head_commit.message }}"
        user_name: 'Vitan'
        user_email: 'vitan.me@gmail.com'
