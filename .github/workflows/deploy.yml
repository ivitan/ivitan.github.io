name: Hexo Deploy

on:
  push:
    branches: [source]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # 使用最新的长期支持版本 (LTS)
          cache: 'npm'

      - name: Rebuild Dependencies
        run: |
          # 彻底清除旧环境残留
          rm -f package-lock.json
          # 使用 --force 忽略旧插件的 Peer Dependency 冲突
          npm install --force

      - name: Build
        run: |
          npx hexo clean
          npx hexo generate
          # 诊断：如果 index.html 小于 1KB，说明渲染仍有问题
          ls -lh public/index.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: master
          publish_dir: ./public
          cname: ivitan.com
