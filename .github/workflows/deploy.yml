name: Hexo Deploy

on:
  push:
    branches: 
      - source

jobs:
  build: 
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: source

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm'

    - name: Install & Generate
      run: |
        npm install
        npx hexo clean
        npx hexo generate # 观察这一步的输出文件数量

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: master
        publish_dir: ./public
        cname: ivitan.com
