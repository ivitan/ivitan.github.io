name: Hexo Deploy

on:
  push:
    branches: [source]

jobs:
  build: 
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20" # 升级至最新稳定 LTS
        cache: 'npm'

    - name: Install & Build
      run: |
        # 强制删除旧的锁文件，防止版本死锁导致构建出的文件为空
        rm -f package-lock.json
        npm install --force
        npx hexo clean
        npx hexo generate
        
        # 验证构建结果：Stellar 首页必须包含渲染后的 HTML 标签
        echo "--- 检查首页渲染逻辑 ---"
        grep -q "<html" public/index.html && echo "Render Success" || echo "Render Failed: Empty Content"

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: master
        publish_dir: ./public
        cname: ivitan.com
