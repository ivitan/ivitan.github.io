name: Hexo Deploy

on:
  push:
    branches:
      - source

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      - name: Install Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --force

      - name: Build
        run: |
          npx hexo clean
          npx hexo generate
          # 检查是否生成了 HTML
          ls -lh public/index.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          # 核心：使用内置 Token，不需要配置 Secrets
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: master
          publish_dir: ./public
          cname: ivitan.com
          user_name: 'Vitan'
          user_email: 'vitan.me@gmail.com'
          force_orphan: true
